<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Rodrigo Chess // Mobile Cyber Edition</title>
  
  <!-- Dependências: Chessboard.js + Chess.js + jQuery + Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

  <style>
    :root {
      --bg-color: #0b0f19;
      --panel-bg: rgba(17, 24, 39, 0.85);
      --border-color: rgba(0, 243, 255, 0.2);
      --accent-neon: #00f3ff;
      --accent-glow: rgba(0, 243, 255, 0.4);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --btn-bg: #00f3ff;
      --btn-hover: #00c2cc;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(120, 0, 255, 0.05) 0%, transparent 40%);
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-main);
      box-sizing: border-box;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 15px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
      max-width: 480px;
      width: 100%;
      box-sizing: border-box;
    }

    .board-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      margin: 0 0 10px 0;
      color: var(--text-main);
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px var(--accent-glow);
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    h1::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: var(--accent-neon);
      box-shadow: 0 0 10px var(--accent-neon);
      border-radius: 50%;
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .vs-card {
      background: rgba(13, 17, 23, 0.8);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
    }

    .vs-card .player {
      font-weight: 600;
      font-size: 12px;
    }

    .vs-card span:nth-child(2) {
      font-family: 'Orbitron', sans-serif;
      color: var(--accent-neon);
      font-size: 11px;
    }

    .difficulty-group label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: rgba(13, 17, 23, 0.9);
      color: var(--text-main);
      font-size: 13px;
      margin-bottom: 10px;
      outline: none;
      box-sizing: border-box;
    }

    select:focus {
      border-color: var(--accent-neon);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    button {
      background: var(--btn-bg);
      color: #0b0f19;
      border: none;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    button:active {
      background: var(--btn-hover);
    }

    #status {
      padding: 10px;
      background: rgba(13, 17, 23, 0.6);
      border-left: 3px solid var(--accent-neon);
      border-radius: 0 8px 8px 0;
      font-size: 12px;
      color: var(--text-main);
      box-sizing: border-box;
    }

    .history-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
      display: block;
    }

    #move-history {
      max-height: 100px;
      overflow-y: auto;
      background: rgba(13, 17, 23, 0.8);
      border: 1px solid var(--border-color);
      padding: 8px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: var(--accent-neon);
      border-radius: 8px;
      box-sizing: border-box;
    }

    /* Ajuste para telas maiores (Desktop/Tablet) */
    @media (min-width: 768px) {
      body {
        padding: 20px;
      }
      .container {
        flex-direction: row;
        max-width: 900px;
        padding: 30px;
        gap: 30px;
      }
      .board-container {
        width: 450px;
      }
      .panel {
        flex: 1;
        justify-content: space-between;
      }
      h1 {
        font-size: 22px;
      }
      .vs-card .player {
        font-size: 14px;
      }
      .difficulty-group label {
        font-size: 13px;
      }
      select, button {
        font-size: 14px;
      }
      #status {
        font-size: 13px;
      }
      #move-history {
        max-height: 140px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="board-container">
    <h1>Rodrigo Chess</h1>
    <div id="board" style="width: 100%"></div>
  </div>

  <div class="panel">
    <div>
      <div class="vs-card">
        <span class="player">USER // BRANCAS</span>
        <span>VS</span>
        <span class="player" style="color: var(--accent-neon);">RODRIGO AI</span>
      </div>

      <div class="difficulty-group" style="margin-top: 15px;">
        <label for="difficulty">Nível de Processamento:</label>
        <select id="difficulty">
          <option value="1">1. Iniciante (Movimentos Aleatórios)</option>
          <option value="2">2. Amador (Capturas Imediatas)</option>
          <option value="3" selected>3. Intermediário (Visão 2 jogadas)</option>
          <option value="4">4. Avançado (Visão 3 jogadas)</option>
          <option value="5">5. Mestre (Visão Profunda + Posicionamento)</option>
        </select>
        <button id="btn-newgame">INICIALIZAR NOVO JOGO</button>
      </div>

      <div id="status">Sua vez de jogar.</div>
    </div>

    <div>
      <span class="history-label">Logs de Execução:</span>
      <div id="move-history"></div>
    </div>
  </div>
</div>

<script>
  let board = null;
  const game = new Chess();
  const $status = $('#status');
  const $history = $('#move-history');

  const pieceValues = {
    p: 10,
    n: 30,
    b: 30,
    r: 50,
    q: 90,
    k: 1000
  };

  function onDragStart(source, piece) {
    if (game.game_over() || piece.search(/^b/) !== -1) return false;
  }

  function makeRodrigoMove() {
    const level = parseInt($('#difficulty').val());
    const moves = game.moves();

    if (moves.length === 0) return;

    let selectedMove = null;

    if (level === 1) {
      selectedMove = moves[Math.floor(Math.random() * moves.length)];
    } else if (level === 2) {
      const captureMoves = game.moves({ verbose: true }).filter(m => m.captured);
      if (captureMoves.length > 0) {
        selectedMove = captureMoves[Math.floor(Math.random() * captureMoves.length)].san;
      } else {
        selectedMove = moves[Math.floor(Math.random() * moves.length)];
      }
    } else {
      const depth = level === 3 ? 2 : (level === 4 ? 3 : 4);
      selectedMove = getBestMove(game, depth, level === 5);
    }

    game.move(selectedMove);
    board.position(game.fen());
    updateStatus();
  }

  function getBestMove(game, depth, usePositionalBonus) {
    let bestMove = null;
    let bestValue = -Infinity;
    const moves = game.moves({ verbose: true });

    for (let move of moves) {
      game.move(move);
      let boardValue = minimax(game, depth - 1, -10000, 10000, false, usePositionalBonus);
      game.undo();

      if (boardValue > bestValue) {
        bestValue = boardValue;
        bestMove = move.san;
      }
    }
    return bestMove || moves[0].san;
  }

  function minimax(game, depth, alpha, beta, isMaximizing, usePositionalBonus) {
    if (depth === 0 || game.game_over()) {
      return evaluateBoard(game, usePositionalBonus);
    }

    const moves = game.moves();

    if (isMaximizing) {
      let maxEval = -Infinity;
      for (let move of moves) {
        game.move(move);
        let eval = minimax(game, depth - 1, alpha, beta, false, usePositionalBonus);
        game.undo();
        maxEval = Math.max(maxEval, eval);
        alpha = Math.max(alpha, eval);
        if (beta <= alpha) break;
      }
      return maxEval;
    } else {
      let minEval = Infinity;
      for (let move of moves) {
        game.move(move);
        let eval = minimax(game, depth - 1, alpha, beta, true, usePositionalBonus);
        game.undo();
        minEval = Math.min(minEval, eval);
        beta = Math.min(beta, eval);
        if (beta <= alpha) break;
      }
      return minEval;
    }
  }

  function evaluateBoard(game, usePositionalBonus) {
    let totalEvaluation = 0;
    const boardState = game.board();

    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const piece = boardState[r][c];
        if (piece) {
          let val = pieceValues[piece.type];
          
          if (usePositionalBonus && (r >= 3 && r <= 4 && c >= 3 && c <= 4)) {
            val += 2;
          }

          if (piece.color === 'b') {
            totalEvaluation += val;
          } else {
            totalEvaluation -= val;
          }
        }
      }
    }
    return totalEvaluation;
  }

  function onDrop(source, target) {
    const move = game.move({
      from: source,
      to: target,
      promotion: 'q'
    });

    if (move === null) return 'snapback';

    updateStatus();
    window.setTimeout(makeRodrigoMove, 300);
  }

  function onSnapEnd() {
    board.position(game.fen());
  }

  function updateStatus() {
    let statusText = '';

    if (game.in_checkmate()) {
      statusText = game.turn() === 'w' ? 'STATUS: Xeque-mate! Rodrigo AI venceu.' : 'STATUS: Xeque-mate! Você venceu!';
    } else if (game.in_draw()) {
      statusText = 'STATUS: Fim de jogo // Empate.';
    } else {
      statusText = game.turn() === 'w' ? 'Sua vez de executar jogada.' : 'Rodrigo AI está processando...';
      if (game.in_check()) {
        statusText += ' [ALERTA: EM XEQUE!]';
      }
    }

    $status.html(statusText);

    const history = game.history();
    let historyHTML = '';
    for (let i = 0; i < history.length; i += 2) {
      historyHTML += `<div>[${(i/2)+1}] ${history[i]} ${history[i+1] || ''}</div>`;
    }
    $history.html(historyHTML);
    $history.scrollTop($history[0].scrollHeight);
  }

  const config = {
    draggable: true,
    position: 'start',
    onDragStart: onDragStart,
    onDrop: onDrop,
    onSnapEnd: onSnapEnd,
    pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
  };

  board = Chessboard('board', config);

  // Recalcula o tamanho do tabuleiro caso a tela mude de orientação
  $(window).resize(function() {
    board.resize();
  });

  $('#btn-newgame').on('click', () => {
    game.reset();
    board.position('start');
    updateStatus();
  });
</script>

</body>
</html>
